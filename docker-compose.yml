version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: production_management_db
    environment:
      POSTGRES_USER: production_user
      POSTGRES_PASSWORD: production_password
      POSTGRES_DB: production_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U production_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: production_management_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://production_user:production_password@db:5432/production_management
      JWT_SECRET: your_secret_key_change_this
      FRONTEND_URL: http://localhost:3000
      VERCEL_FRONTEND_URL: https://production-management-system-drab.vercel.app
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
